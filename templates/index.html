<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus AI Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 18px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
  .err { align-self: flex-start; background: #7f1d1d; color: #fecaca; }
  form { display: flex; gap: 8px; padding: 12px; background: #1e293b; border-top: 1px solid #334155; }
  input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 15px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>Nexus AI</header>
<div id="chat"></div>
<form id="form">
  <input id="input" type="text" placeholder="Type a message... (/fast /deep /code /normal)" autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const sessionId = 'web-' + Math.random().toString(36).slice(2, 10);

  function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    addMessage(message, 'user');
    sendBtn.disabled = true;
    const pending = addMessage('...', 'bot');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, session_id: sessionId })
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        pending.className = 'msg err';
        pending.textContent = data.error || ('Request failed (' + res.status + ')');
      } else {
        pending.textContent = data.response;
      }
    } catch (err) {
      pending.className = 'msg err';
      pending.textContent = 'Network error: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
